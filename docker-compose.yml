services:
  backend:
    build: ./backend
    environment:
      APP_TIMEZONE: Asia/Almaty
    volumes:
      - trips-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/days')"]
      interval: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trips-data:
